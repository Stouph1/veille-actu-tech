name: Veille quotidienne

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Lancer la pipeline de veille
        run: python3 veille_rss.py

      - name: Publier les résultats sur le site
        run: cp veille.json docs/veille.json

      - name: Commit des nouveaux articles
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille.csv veille.json seen.json docs/veille.json
          git diff --cached --quiet && echo "Aucun nouvel article" || git commit -m "Veille du $(date +%Y-%m-%d)"
          git push
