name: Veille quotidienne

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Lancer la pipeline de veille
        run: python3 veille_rss.py

      - name: Commit des nouveaux articles
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille.csv veille.json seen.json docs/veille.json
          if git diff --cached --quiet; then
            echo "Aucun nouvel article"
          else
            git commit -m "Veille du $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
